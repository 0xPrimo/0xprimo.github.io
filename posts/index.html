 <div class="tag-filter-container" style="margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 8px;"> 

   <button id="btn-all" class="tag-filter-btn active" onclick="toggleTag('all', this)" style="padding: 6px 14px; border-radius: 6px; background: var(--entry); color: var(--primary); border: 1px solid var(--tertiary); cursor: pointer; font-family: inherit; font-size: 0.85rem; transition: all 0.2s ease;">All</button></div> 

 <div class="filtered-posts-grid"> 
 </div> 

  
 <style>
   .card-item.filter-hidden {
     display: none !important;
   }
 </style>

 <script> 
   let selectedTags = new Set(); 

   function toggleTag(tag, buttonElement) { 
     const allBtn = document.getElementById('btn-all'); 

     if (tag === 'all') { 
       selectedTags.clear(); 
       document.querySelectorAll('.tag-filter-btn').forEach(btn => { 
         btn.classList.remove('active'); 
         btn.style.color = 'var(--secondary)'; 
         btn.style.background = 'var(--entry)'; 
         btn.style.borderColor = 'var(--tertiary)'; 
       }); 
       allBtn.classList.add('active'); 
       allBtn.style.color = 'var(--primary)'; 
       allBtn.style.background = 'rgba(137, 180, 250, 0.1)'; 
       allBtn.style.borderColor = '#89b4fa'; 
     } else { 
       allBtn.classList.remove('active'); 
       allBtn.style.color = 'var(--secondary)'; 
       allBtn.style.background = 'var(--entry)'; 
       allBtn.style.borderColor = 'var(--tertiary)'; 

       if (selectedTags.has(tag)) { 
         selectedTags.delete(tag); 
         buttonElement.classList.remove('active'); 
         buttonElement.style.color = 'var(--secondary)'; 
         buttonElement.style.background = 'var(--entry)'; 
         buttonElement.style.borderColor = 'var(--tertiary)'; 
       } else { 
         selectedTags.add(tag); 
         buttonElement.classList.add('active'); 
         buttonElement.style.color = '#89b4fa'; 
         buttonElement.style.background = 'rgba(137, 180, 250, 0.1)'; 
         buttonElement.style.borderColor = '#89b4fa'; 
       } 

       if (selectedTags.size === 0) { 
         allBtn.classList.add('active'); 
         allBtn.style.color = 'var(--primary)'; 
         allBtn.style.background = 'rgba(137, 180, 250, 0.1)'; 
         allBtn.style.borderColor = '#89b4fa'; 
       } 
     } 

     applyFilters(); 
   } 

   function applyFilters() { 
     const cards = document.querySelectorAll('.card-item'); 

     cards.forEach(card => { 
       const cardTagsAttr = card.getAttribute('data-tags') || ''; 
       const cardTags = cardTagsAttr.split(' ').filter(Boolean); 

       if (selectedTags.size === 0) { 
         card.classList.remove('filter-hidden'); 
       } else { 
         
         const matches = Array.from(selectedTags).some(tag => cardTags.includes(tag)); 
         if (matches) { 
           card.classList.remove('filter-hidden'); 
         } else { 
           card.classList.add('filter-hidden'); 
         } 
       } 
     }); 
   } 

   document.addEventListener("DOMContentLoaded", () => { 
     const allBtn = document.getElementById('btn-all'); 
     if(allBtn) { 
       allBtn.style.color = 'var(--primary)'; 
       allBtn.style.background = 'rgba(137, 180, 250, 0.1)'; 
       allBtn.style.borderColor = '#89b4fa'; 
     } 
   }); 
 </script>

<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });
</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };
</script></body>
